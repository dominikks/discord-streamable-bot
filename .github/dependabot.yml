version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Patch updates are low-risk and can be reviewed together
      cargo-patch:
        update-types:
          - "patch"
      # Minor and major updates may be breaking and are grouped separately
      cargo-minor-major:
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Group all Actions updates together since they don't have meaningful patch updates
      actions-all:
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
